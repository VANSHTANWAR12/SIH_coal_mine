<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Strategy & Prescriptions – CoalGuard</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .layout-grid { display: grid; grid-template-columns: 350px 1fr; gap: 24px; min-height: calc(100vh - 180px); }
    
    /* Left Panel: Searchable Mine List */
    .mine-list-panel { background: white; border: 1px solid var(--border); border-radius: var(--radius-md); display: flex; flex-direction: column; overflow: hidden; }
    .mlp-header { padding: 16px; border-bottom: 1px solid var(--border); background: #F8FAFC; }
    .search-box { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; outline: none; margin-top: 8px; }
    .search-box:focus { border-color: var(--brand-primary); }
    .mlp-content { overflow-y: auto; flex: 1; }
    
    .mine-item { padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s; display: flex; justify-content: space-between; align-items: center; }
    .mine-item:hover { background: #F1F5F9; }
    .mine-item.active { background: #E0E7FF; border-left: 4px solid var(--brand-primary); }
    .mi-name { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
    .mi-meta { font-size: 11px; color: var(--text-secondary); display: flex; gap: 8px; }
    .risk-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: white; }
    .risk-Critical { background: var(--danger); }
    .risk-High { background: var(--amber); }
    .risk-Medium { background: var(--info); }
    .risk-Low { background: var(--success); }

    /* Right Panel: Strategy Brief */
    .strategy-panel { background: white; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 32px; display: flex; flex-direction: column; }
    .sp-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 24px; }
    .sp-title { font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; }
    .sp-subtitle { font-size: 14px; color: var(--text-secondary); }
    
    .kpi-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .kpi-box { padding: 16px; background: #F8FAFC; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .kpi-box-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 4px; }
    .kpi-box-val { font-size: 18px; font-weight: 800; color: var(--text-primary); }
    
    .strategy-section { margin-bottom: 32px; }
    .ss-title { font-size: 14px; font-weight: 800; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .ss-title svg { color: var(--brand-primary); }
    
    .prescriptions-list { display: flex; flex-direction: column; gap: 16px; }
    .prescription-card { padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border); background: white; border-left: 4px solid var(--brand-primary); }
    .pc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .pc-type { font-size: 12px; font-weight: 800; color: var(--brand-primary); text-transform: uppercase; letter-spacing: 0.5px; background: #E0E7FF; padding: 4px 10px; border-radius: 20px; }
    .pc-body { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
    
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); text-align: center; }
    .empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5; }
    .empty-state h3 { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }

  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>

    <div class="main-content">
      <header class="top-header">
        <div class="header-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" placeholder="Search strategy models...">
        </div>
        <div class="header-links">
          <a href="dashboard.html" class="header-link">HQ Dashboard</a>
          <a href="#" class="header-link active">Intelligence Engine</a>
        </div>
        <div class="system-status-pill"><div class="status-dot"></div> AI Engine Operational</div>
      </header>

      <main class="page-wrapper">
        <div class="control-bar">
          <div>
            <h1 class="page-title">AI Strategy & Prescriptions</h1>
            <div class="page-subtitle">Algorithmic recommendations for safety, production, and governance optimization.</div>
          </div>
        </div>

        <div class="layout-grid">
          <!-- Left Panel -->
          <div class="mine-list-panel">
            <div class="mlp-header">
              <div style="font-size: 13px; font-weight: 700;">Select Target Mine</div>
              <input type="text" id="mineSearch" class="search-box" placeholder="Filter by name or subsidiary...">
            </div>
            <div class="mlp-content" id="mineList">
              <!-- Dynamically populated via JS -->
            </div>
          </div>

          <!-- Right Panel -->
          <div class="strategy-panel" id="strategyPanel">
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
              <h3>Select a Mine</h3>
              <p>Choose a mine from the left panel to generate an AI strategy brief.</p>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/mines-db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const mineListEl = document.getElementById('mineList');
      const searchBox = document.getElementById('mineSearch');
      
      // Render Mine List
      function renderMines(filterText = '') {
        mineListEl.innerHTML = '';
        const filtered = REAL_MINES.filter(m => 
          m.name.toLowerCase().includes(filterText) || 
          m.sub.toLowerCase().includes(filterText)
        );

        filtered.forEach(mine => {
          const el = document.createElement('div');
          el.className = 'mine-item';
          el.innerHTML = `
            <div>
              <div class="mi-name">\${mine.name}</div>
              <div class="mi-meta"><span>\${mine.sub}</span> • <span>\${mine.type}</span></div>
            </div>
            <div class="risk-badge risk-\${mine.risk}">\${mine.risk}</div>
          `;
          el.addEventListener('click', () => {
            document.querySelectorAll('.mine-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            generateStrategy(mine);
          });
          mineListEl.appendChild(el);
        });
      }

      // Generate Strategy Brief
      function generateStrategy(mine) {
        const panel = document.getElementById('strategyPanel');
        
        // --- 1. Recommendation Engine Logic ---
        let prescriptions = [];
        
        // Rule 1: Safety First
        if (mine.risk === 'Critical' || mine.risk === 'High') {
          prescriptions.push({
            type: 'Immediate Safety Protocol',
            color: 'var(--danger)',
            bg: 'var(--danger-bg)',
            text: `<strong>Halt non-essential expansion.</strong> Risk score is highly elevated (\${mine.riskScore}/100). Focus resources exclusively on strata support and ventilation monitoring. Production quotas should be secondary until the risk profile stabilizes. \${mine.reason}`
          });
        }

        // Rule 2: Efficiency & Quantity Upscaling
        if ((mine.risk === 'Low' || mine.risk === 'Medium') && (mine.prod.includes('<1.0') || mine.prod.includes('~1.15') || mine.prod.includes('~0.81'))) {
          prescriptions.push({
            type: 'Production Upscale Strategy',
            color: 'var(--success)',
            bg: 'var(--success-bg)',
            text: `<strong>Safe to Scale.</strong> Operational safety margins are excellent. Recommend deploying larger HEMM fleets or adding one extra operational shift to boost bulk output. Output is currently constrained by machinery rather than safety limits.`
          });
        }

        // Rule 3: Quality Optimization
        if (mine.gcv > 5500) {
          prescriptions.push({
            type: 'Quality Optimization',
            color: 'var(--brand-primary)',
            bg: '#E0E7FF',
            text: `<strong>High Grade Coal Detected (\${mine.grade}).</strong> Prioritize selective, precision mining techniques (e.g., Continuous Miners) to maximize GCV retention. Avoid bulk explosive blasting that could cause excessive fine generation or contamination.`
          });
        } else if (mine.gcv < 3500) {
            prescriptions.push({
            type: 'Bulk Processing Route',
            color: 'var(--info)',
            bg: 'var(--info-bg)',
            text: `<strong>Lower Grade Thermal Coal.</strong> Focus purely on bulk extraction efficiency and dispatch logistics. Washery optimization is recommended before dispatch to nearby thermal power plants.`
          });
        }

        // Rule 4: Governance & Compliance
        if (mine.compliance < 70) {
          prescriptions.push({
            type: 'Governance Intervention',
            color: 'var(--amber)',
            bg: '#FEF3C7',
            text: `<strong>Statutory Risk Warning.</strong> Compliance score is critically low (\${mine.compliance}%). Immediate contractor safety audit and review of pending DGMS clearances required. Implement automated biometric gating to restrict unauthorized contractor entry.`
          });
        }

        // NEW Rule 5: Stripping Ratio Optimization
        if (mine.type === 'Opencast' && parseFloat(mine.strippingRatio) >= 3.0) {
          prescriptions.push({
            type: 'Overburden Cost Reduction',
            color: 'var(--amber)',
            bg: '#FEF3C7',
            text: `<strong>High Stripping Ratio (\${mine.strippingRatio} cu.m/t).</strong> Overburden removal costs are severely impacting profitability. Transition from Shovel-Dumper combination to high-capacity Draglines to drastically reduce OBR cost per tonne.`
          });
        }

        // NEW Rule 6: OMS / Labor Productivity
        if ((mine.type === 'Opencast' && parseFloat(mine.oms) < 14.0) || (mine.type === 'Underground' && parseFloat(mine.oms) < 1.0)) {
           prescriptions.push({
            type: 'Workforce Productivity',
            color: 'var(--info)',
            bg: 'var(--info-bg)',
            text: `<strong>Low Output per Manshift (OMS: \${mine.oms} t).</strong> Labor productivity is lagging below baseline. Recommend immediate mechanization upgrade (deploy \${mine.type === 'Opencast' ? 'Surface Miners' : 'Continuous Miners'}) and comprehensive contractor workforce optimization.`
          });
        }

        // --- 2. Render UI ---
        let html = \`
          <div class="sp-header">
            <div>
              <div class="sp-title">\${mine.name}</div>
              <div class="sp-subtitle">\${mine.sub} • \${mine.type} • Geo-coordinates: \${mine.coords.lat}, \${mine.coords.lng}</div>
            </div>
            <button class="btn btn-primary" onclick="window.mockAction(this, 'Strategy PDF Exported to HQ')">Export Strategy Report</button>
          </div>

          <h4 style="font-size: 12px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 12px; font-weight: 800;">Strategic Profile</h4>
          <div class="kpi-grid-4">
            <div class="kpi-box">
              <div class="kpi-box-label">Risk Profile</div>
              <div class="kpi-box-val" style="color: \${mine.risk === 'Critical'? 'var(--danger)' : mine.risk === 'High'? 'var(--amber)' : 'var(--text-primary)'}">\${mine.risk}</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-box-label">Compliance Index</div>
              <div class="kpi-box-val">\${mine.compliance}%</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-box-label">Production Bracket</div>
              <div class="kpi-box-val" style="font-size:16px">\${mine.prod}</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-box-label">Coal Grade</div>
              <div class="kpi-box-val" style="font-size:16px">\${mine.grade}</div>
            </div>
          </div>

          <h4 style="font-size: 12px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 12px; font-weight: 800; margin-top: 24px;">Operational Metrics</h4>
          <div class="kpi-grid-4">
            <div class="kpi-box">
              <div class="kpi-box-label">Mechanization Type</div>
              <div class="kpi-box-val" style="font-size:14px">\${mine.mechanization || 'Conventional'}</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-box-label">OMS (Output per Manshift)</div>
              <div class="kpi-box-val">\${mine.oms || 'N/A'} <span style="font-size:12px; color:var(--text-secondary); font-weight:600">tonnes</span></div>
            </div>
            <div class="kpi-box">
              <div class="kpi-box-label">Stripping Ratio (OBR)</div>
              <div class="kpi-box-val">\${mine.strippingRatio || 'N/A'} <span style="font-size:12px; color:var(--text-secondary); font-weight:600">cu.m/t</span></div>
            </div>
          </div>

          <div class="strategy-section" style="margin-top: 32px;">
            <div class="ss-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m2 10 10 4 10-4-10-4Z"/><path d="m2 14 10 4 10-4"/><path d="m2 18 10 4 10-4"/></svg>
              AI-Generated Strategy Prescriptions
            </div>
            <div class="prescriptions-list">
        \`;

        prescriptions.forEach(p => {
          html += \`
            <div class="prescription-card" style="border-left-color: \${p.color};">
              <div class="pc-header">
                <span class="pc-type" style="background: \${p.bg}; color: \${p.color};">\${p.type}</span>
              </div>
              <div class="pc-body">\${p.text}</div>
            </div>
          \`;
        });

        if(prescriptions.length === 0) {
            html += \`<div style="padding:16px; color:var(--text-secondary); text-align:center;">No high-priority strategic interventions required at this time. Standard operating procedures apply.</div>\`;
        }

        html += \`
            </div>
          </div>
        \`;

        panel.innerHTML = html;
      }

      // Init
      searchBox.addEventListener('input', (e) => renderMines(e.target.value.toLowerCase()));
      renderMines();
    });
  </script>
</body>
</html>
